[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hexton"
version = "0.1.0"
description = "Hexton — local, Windows-first YouTube Shorts scheduler (backend)"
readme = "README.md"
requires-python = ">=3.12,<4"
license = { text = "Proprietary" }
dependencies = [
    # Local HTTP API. FastAPI pulls in starlette and pydantic.
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4,<3",
    # Persistence. SQLAlchemy 2.x typed ORM + Alembic migrations.
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.13,<2",
    # Resumable upload protocol needs a persisted session URI: raw httpx, per FEAS-04.
    "httpx>=0.27,<1",
    # HARD dependency on Windows: CPython ships no IANA database (Phase 0 evidence).
    "tzdata>=2024.1",
    # SSE / event framing for live worker updates.
    "sse-starlette>=2.1,<3",
]

[project.optional-dependencies]
# Official Google client libraries, used for supported non-upload operations
# (identity resolution, report reads) from Phase 2 onward. Kept separate so the
# Phase 1 foundation does not depend on a network-facing library it does not yet call.
google = [
    "google-api-python-client>=2.140,<3",
    "google-auth>=2.33,<3",
    "google-auth-httplib2>=0.2,<1",
]

dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["hexton*"]

# --------------------------------------------------------------------------
# Tooling
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["hexton"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "RUF001",  # ambiguous unicode: the UI copy uses em dashes deliberately
    "RUF002",
    "RUF003",
    # ``class JobState(str, Enum)`` is kept rather than ``StrEnum``: 3.11 changed
    # ``str()``/``format()`` for StrEnum members, and job states are formatted in
    # event messages and API payloads today. Migrating needs a behaviour test first,
    # not a lint autofix.
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's declared-parameter idiom reads as a mutable default to B008, but these
# call results are immutable dependency descriptors and are the documented pattern.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B011", "SIM117"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.*", "googleapiclient.*", "httplib2.*", "sse_starlette.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:hexton.*"]
